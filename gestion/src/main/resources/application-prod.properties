# ===========================================
# CONFIGURACIÓN PARA PRODUCCIÓN
# ===========================================
# Copiar este archivo a application-prod.properties y ajustar valores

# Base de datos (usar variables de entorno en producción)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# JPA - No mostrar SQL en producción
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT - USAR VALORES SEGUROS EN PRODUCCIÓN
# Generar con: openssl rand -base64 64
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000

# HTTPS Obligatorio en producción
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEY_STORE_PATH}
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=linogo

# Logging más restrictivo
logging.level.root=WARN
logging.level.com.linogo.gestion=INFO
logging.level.org.springframework.security=WARN

# Rate limiting más estricto
app.rate-limit.login-attempts=3
app.rate-limit.window-minutes=5
