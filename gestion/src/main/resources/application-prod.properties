# ===========================================
# CONFIGURACIN PARA PRODUCCIN
# ===========================================

# Base de datos (Construido a partir de variables de Railway o DATABASE_URL)
# Railway provee individualmente PGHOST, PGPORT, etc. o una DATABASE_URL que empieza con postgres://
# Usamos un valor por defecto que construye el JDBC URL a partir de las variables individuales.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD}}

# JPA - Crear tablas automticamente en el primer despliegue
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT - USAR VALORES SEGUROS EN PRODUCCIN
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000

# HTTPS - Railway maneja SSL en el balanceador, as que la app corre en HTTP
# Solo activar si se proveen certificados reales
server.ssl.enabled=${SERVER_SSL_ENABLED:false}
# server.ssl.key-store=${SSL_KEY_STORE_PATH}
# server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD}
# server.ssl.key-store-type=PKCS12
# server.ssl.key-alias=linogo

# Logging ms restrictivo
logging.level.root=WARN
logging.level.com.linogo.gestion=INFO
logging.level.org.springframework.security=WARN

# Rate limiting ms estricto
app.rate-limit.login-attempts=3
app.rate-limit.window-minutes=5
