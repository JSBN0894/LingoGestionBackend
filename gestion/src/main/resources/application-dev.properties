# ===========================================
# CONFIGURACIÓN PARA DESARROLLO (Local + Railway Dev)
# ===========================================

# Base de datos: Usa variables de Railway si existen, si no, usa localhost (para tu PC)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:gestion_db_dev}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:postgres}}

# JPA - Desarrollo
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT - Desarrollo (Usa variable o un valor por defecto inseguro solo para dev)
app.jwt.secret=${JWT_SECRET:dev_secret_key_only_for_local_development_purposes_123456789}
app.jwt.access-token-expiration=3600000
app.jwt.refresh-token-expiration=86400000

# Logging - Más detallado en desarrollo
logging.level.root=INFO
logging.level.com.linogo.gestion=DEBUG
logging.level.org.springframework.security=DEBUG

# Rate limiting - Más relajado en desarrollo
app.rate-limit.login-attempts=20
app.rate-limit.window-minutes=1
