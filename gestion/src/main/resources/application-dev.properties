# ===========================================
# CONFIGURACIÓN PARA DESARROLLO (Local + Railway Dev + Docker)
# ===========================================

# Base de datos:
# - Docker: SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/gestion
# - Railway Dev: Usa variables PGHOST, PGPORT, etc.
# - Local: localhost por defecto
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:gestion}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:postgres}}

# Flyway - Migraciones de base de datos
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JPA - Desarrollo (validate para que Flyway maneje el schema)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT - Desarrollo (Usa variable o un valor por defecto inseguro solo para dev)
app.jwt.secret=${JWT_SECRET:TGlub2dvMjAyNg==}
app.jwt.access-token-expiration=3600000
app.jwt.refresh-token-expiration=86400000

# Logging - Más detallado en desarrollo
logging.level.root=INFO
logging.level.com.linogo.gestion=DEBUG
logging.level.org.springframework.security=DEBUG

# Rate limiting - Más relajado en desarrollo
app.rate-limit.login-attempts=20
app.rate-limit.window-minutes=1
