spring.application.name=gestion

# ===========================================
# CONFIGURACIÓN DE BASE DE DATOS (Dinamizada para Railway)
# ===========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:gestion_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===========================================
# CONFIGURACIÓN JPA
# ===========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===========================================
# INICIALIZACIÓN SQL (Se recomienda 'never' si usas ddl-auto=update para evitar errores)
# ===========================================
spring.sql.init.mode=never
spring.sql.init.platform=postgres
spring.sql.init.continue-on-error=true

# ===========================================
# CONFIGURACIÓN DEL SERVIDOR
# ===========================================
server.address=0.0.0.0
server.port=${PORT:8080}

# ===========================================
# SEGURIDAD - JWT
# ===========================================
app.jwt.secret=${JWT_SECRET:VGhpc0lzQVN1cGVyU2VjdXJlSldUU2VjcmV0S2V5VGhhdElzQXRMZWFzdDI1NkJpdHNMb25nQW5kU2hvdWxkQmVDaGFuZ2VkSW5Qcm9kdWN0aW9u}
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000

# ===========================================
# SPRINGDOC OPENAPI
# ===========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=false
springdoc.api-docs.enabled=true

# ===========================================
# LOGGING
# ===========================================
logging.level.root=INFO
logging.level.com.linogo.gestion=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ===========================================
# RATE LIMITING
# ===========================================
app.rate-limit.login-attempts=5
app.rate-limit.window-minutes=1
