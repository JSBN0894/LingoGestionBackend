spring.application.name=gestion

# ===========================================
# CONFIGURACIÓN DE BASE DE DATOS
# ===========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/gestion_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ===========================================
# CONFIGURACIÓN JPA
# ===========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===========================================
# INICIALIZACIÓN SQL
# ===========================================
spring.sql.init.mode=always
spring.sql.init.platform=postgres
spring.sql.init.continue-on-error=true

# ===========================================
# CONFIGURACIÓN DEL SERVIDOR
# ===========================================
server.address=0.0.0.0
server.port=8080

# ===========================================
# SEGURIDAD - JWT (CAMBIAR EN PRODUCCIÓN)
# ===========================================
# Generar secret con: openssl rand -base64 64 (mínimo 256 bits)
app.jwt.secret=VGhpc0lzQVN1cGVyU2VjdXJlSldUU2VjcmV0S2V5VGhhdElzQXRMZWFzdDI1NkJpdHNMb25nQW5kU2hvdWxkQmVDaGFuZ2VkSW5Qcm9kdWN0aW9u
# Access token: 15 minutos (en milisegundos)
app.jwt.access-token-expiration=900000
# Refresh token: 7 días (en milisegundos)
app.jwt.refresh-token-expiration=604800000

# ===========================================
# SEGURIDAD - HTTPS (PRODUCCIÓN)
# ===========================================
# Descomentar en producción con certificados reales
# server.ssl.enabled=true
# server.ssl.key-store=classpath:certs/keystore.p12
# server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD}
# server.ssl.key-store-type=PKCS12
# server.ssl.key-alias=linogo

# ===========================================
# SPRINGDOC OPENAPI
# ===========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ===========================================
# LOGGING
# ===========================================
logging.level.root=INFO
logging.level.com.linogo.gestion=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ===========================================
# RATE LIMITING
# ===========================================
# Intentos de login por minuto por IP
app.rate-limit.login-attempts=5
app.rate-limit.window-minutes=1
