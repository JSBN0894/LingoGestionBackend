# ===========================================
# CONFIGURACION PARA PRODUCCION
# ===========================================

# Base de datos (Usa variables de Railway)
# Railway provee DATABASE_URL con formato 'postgresql://...' (sin jdbc: prefijo)
# Usamos SPRING_DATASOURCE_URL que Spring Boot reconoce automáticamente
# Si no existe, usamos variables individuales PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:gestion_db}}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT - SECRETO OBLIGATORIO EN PRODUCCION
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000

# HTTPS - Railway maneja SSL en el load balancer
server.ssl.enabled=false

# Inicializacion SQL
spring.sql.init.mode=never
spring.sql.init.continue-on-error=false

# Logging restrictivo
logging.level.root=WARN
logging.level.com.linogo.gestion=INFO
logging.level.org.springframework.security=WARN

# Rate limiting estricto
app.rate-limit.login-attempts=3
app.rate-limit.window-minutes=5

# Swagger DESHABILITADO en produccion
springdoc.swagger-ui.enabled=false
