spring.application.name=gestion

# ===========================================
# CONFIGURACION DE BASE DE DATOS
# ===========================================
# Usa variables de entorno si existen (Railway), sino usa valores por defecto
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:gestion_db}}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===========================================
# CONFIGURACION JPA
# ===========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===========================================
# INICIALIZACION SQL
# ===========================================
spring.sql.init.mode=never
spring.sql.init.continue-on-error=false

# ===========================================
# CONFIGURACION DEL SERVIDOR
# ===========================================
server.address=0.0.0.0
server.port=${PORT:8080}

# ===========================================
# SEGURIDAD - JWT
# ===========================================
# IMPORTANTE: El secreto DEBE venir de variable de entorno en produccion
# Generar con: openssl rand -base64 64
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000

# ===========================================
# SPRINGDOC OPENAPI
# ===========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Swagger solo habilitado en perfil dev
springdoc.swagger-ui.enabled=false

# ===========================================
# LOGGING
# ===========================================
logging.level.root=WARN
logging.level.com.linogo.gestion=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ===========================================
# RATE LIMITING
# ===========================================
app.rate-limit.login-attempts=5
app.rate-limit.window-minutes=1
