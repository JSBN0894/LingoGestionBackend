# ===========================================
# CONFIGURACION PARA DESARROLLO
# ===========================================

# Base de datos local (con soporte para variables de entorno en Railway)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:gestion_db}}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}

# JPA - Mostrar SQL para debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# validate (no update): el esquema ahora se versiona con Flyway (src/main/resources/db/migration).
# Si cambias una entidad, escribe una migracion nueva en vez de dejar que Hibernate altere la tabla.
spring.jpa.hibernate.ddl-auto=validate

# JWT - Valores para desarrollo (NO USAR EN PRODUCCION)
# Generar uno nuevo para produccion con: openssl rand -base64 64
app.jwt.secret=RGV2U2VjcmV0S2V5Rm9yRGV2ZWxvcG1lbnRPbmx5TXVzdEJlQ2hhbmdlZEluUHJvZHVjdGlvbkVudmlyb25tZW50
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000

# HTTPS deshabilitado en desarrollo
server.ssl.enabled=false

# Logging detallado
logging.level.root=INFO
logging.level.com.linogo.gestion=DEBUG
logging.level.org.springframework.security=DEBUG

# Rate limiting mas permisivo en desarrollo
app.rate-limit.login-attempts=10
app.rate-limit.window-minutes=1

# Swagger HABILITADO en desarrollo
springdoc.swagger-ui.enabled=true
