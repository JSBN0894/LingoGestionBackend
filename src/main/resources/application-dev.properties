# ===========================================
# CONFIGURACIÓN PARA DESARROLLO
# ===========================================

# Base de datos local
spring.datasource.url=jdbc:postgresql://localhost:5432/gestion_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA - Mostrar SQL para debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

# JWT - Valores para desarrollo (NO USAR EN PRODUCCIÓN)
app.jwt.secret=RGV2U2VjcmV0S2V5Rm9yRGV2ZWxvcG1lbnRPbmx5TXVzdEJlQ2hhbmdlZEluUHJvZHVjdGlvbkVudmlyb25tZW50
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000

# HTTPS deshabilitado en desarrollo
server.ssl.enabled=false

# Logging detallado
logging.level.root=INFO
logging.level.com.linogo.gestion=DEBUG
logging.level.org.springframework.security=DEBUG

# Rate limiting más permisivo en desarrollo
app.rate-limit.login-attempts=10
app.rate-limit.window-minutes=1
